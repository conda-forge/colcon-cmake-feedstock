{% set name = "colcon-cmake" %}
{% set version = "0.2.30" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/colcon/{{ name }}/archive/{{ version }}.tar.gz
  sha256: f6b16a14697b0c4f21667ed1fbee75b094bdeb54ff27f6a073521d05357a81c5

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - colcon-core
    - colcon-library-path
    - colcon-test-result >=0.3.3

test:
  requires:
    - python {{ python_min }}
  imports:
    - {{ name.replace("-", "_") }}

about:
  home: https://github.com/colcon/{{ name }}
  license: Apache-2.0
  license_file: LICENSE
  summary: |
    An extension for colcon-core to support CMake projects.

extra:
  recipe-maintainers:
    - j-rivero
    - seanyen
    - wolfv
